[package]
name = "libbie-desktop"
version = "0.1.0"
description = "Libbie.ai air-gapped desktop client"
authors = ["Libbie.ai"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The Tauri application logic lives in a lib so it can be shared with tests;
# `main.rs` is a thin shim that calls `run()`. Desktop-only target, so a plain
# rlib is enough (staticlib/cdylib artifacts only matter for mobile).
name = "libbie_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["time", "process", "io-util", "net", "rt", "rt-multi-thread", "sync", "macros"] }
futures-util = "0.3"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
dirs = "5"
# Embedded vector store — pure C, statically linked (no per-platform prebuilt
# binaries), runs anywhere SQLite runs. rusqlite "bundled" compiles SQLite in.
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
# Connectors (Slack / Gmail / IMAP) — permissive only (MIT/Apache/ISC).
# One-shot loopback catcher for OAuth redirects (Slack + Gmail).
tiny_http = "0.12"
# Direct IMAP over a rustls TLS layer, matching reqwest's rustls-tls (ring
# provider) so no second crypto backend or OpenSSL/native-tls is pulled in.
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
# Already in the tree via rustls; used directly for OAuth PKCE (SHA-256) + CSPRNG.
ring = "0.17"

[features]
# This feature is used for production builds where `devUrl` is not set.
custom-protocol = ["tauri/custom-protocol"]

# Release ships cargo defaults unless told otherwise: fat LTO, one codegen unit,
# stripped symbols, and abort-on-panic (no unwinding tables). Smaller installer,
# faster compiles of dependencies, and the app has no catch_unwind paths.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
