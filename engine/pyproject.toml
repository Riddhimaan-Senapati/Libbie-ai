[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libbie-engine"
version = "0.1.0"
description = "Libbie provenance-graph engine: ingest -> extraction -> join -> graph -> briefing, for computational-biology labs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Libbie.ai" }]

# Runtime deps are PERMISSIVE ONLY (MIT / BSD / Apache-2.0). No GPL/AGPL/LGPL/BUSL/SSPL.
#   pydantic     MIT     - typed nodes/edges + validation
#   pyyaml       MIT     - config file (plan section 7)
#   httpx        BSD-3   - LLM HTTP client (OpenAI-compatible local + Anthropic API)
#   networkx     BSD-3   - in-memory graph walks for retrieval/briefing
#   pypdf        BSD-3   - PDF text extraction (deliberately NOT PyMuPDF/fitz, which is AGPL-3.0)
#   typer        MIT     - CLI (type-hint driven; built on click, which stays a transitive BSD-3 dep)
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "networkx>=3.2",
    "pypdf>=4.2",
    "typer>=0.12",
]

[project.optional-dependencies]
# git ingest. GitPython is BSD-3-Clause. (We deliberately avoid pygit2, whose libgit2
# bindings are GPL-2.0-with-linking-exception.) If GitPython is absent the git ingester
# transparently falls back to shelling out to the `git` binary.
git = ["GitPython>=3.1"]
# Optional local embedding model if no OpenAI-compatible endpoint is available.
# sentence-transformers is Apache-2.0.
embed = ["sentence-transformers>=2.7"]
dev = ["pytest>=8.0"]

[project.scripts]
libbie = "libbie_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["libbie_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
